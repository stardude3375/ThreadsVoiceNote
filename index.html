<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Recorder</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
min-height: 100vh;
height: 100vh;
overflow: hidden;
display: flex;
flex-direction: column;
align-items: center;
justify-content: flex-start;
gap: 12px;
font-family: -apple-system, BlinkMacSystemFont, “SF Pro Text”, “Helvetica Neue”, sans-serif;
background: Canvas;
color-scheme: light dark;
padding: 32px 16px 16px;
}

/* ── CARD ── */
.card {
width: min(700px, 96vw);
border-radius: 28px;
padding: 22px 20px 18px;
display: flex;
flex-direction: column;
gap: 14px;
transition: background 0.2s;
user-select: none;
-webkit-user-select: none;
}

.top-row {
display: flex;
align-items: center;
justify-content: flex-end;
}

.btn-dev {
font-family: inherit;
font-size: 10px;
padding: 4px 10px;
border-radius: 8px;
border: 1px dashed rgba(128,128,128,0.4);
background: transparent;
cursor: pointer;
opacity: 0.5;
transition: opacity 0.15s;
}
.btn-dev:hover { opacity: 0.9; }

/* ── PILL ── */
.pill {
border-radius: 26px;
padding: 0 16px;
display: flex;
align-items: center;
gap: 14px;
border: 1px solid transparent;
transition: background 0.2s, border-color 0.2s;
width: 100%;
aspect-ratio: 1090 / 180;
border: none !important;
}

.btn-circle {
width: 38px; height: 38px;
border-radius: 50%;
border: none;
background: transparent;
cursor: pointer;
display: flex; align-items: center; justify-content: center;
flex-shrink: 0;
position: relative;
transition: transform 0.12s;
}
.btn-circle:active { transform: scale(0.91); }

.icon-mic, .icon-stop, .icon-play, .icon-pause { position: absolute; transition: opacity 0.15s; }
.icon-stop  { opacity: 0; }
.icon-play  { opacity: 0; }
.icon-pause { opacity: 0; }
.btn-circle.recording .icon-mic  { opacity: 0; }
.btn-circle.recording .icon-stop { opacity: 1; }
.btn-circle.ready .icon-mic  { opacity: 0; }
.btn-circle.ready .icon-play { opacity: 1; }
.btn-circle.playing .icon-mic   { opacity: 0; }
.btn-circle.playing .icon-play  { opacity: 0; }
.btn-circle.playing .icon-pause { opacity: 1; }

#waveCanvas { flex: 1; height: 48px; display: block; min-width: 0; }

.status { display: none; } /* kept for JS compat but hidden */

.pill-status {
position: absolute;
inset: 0;
display: flex;
align-items: center;
justify-content: center;
font-size: 12px;
opacity: 0.35;
pointer-events: none;
transition: opacity 0.2s;
}
.pill-status.hidden { opacity: 0; }

/* ── BOTTOM ROW ── */
.bottom-row {
display: flex;
align-items: center;
justify-content: space-between;
min-height: 36px;
gap: 8px;
}
.actions { display: flex; gap: 8px; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
.actions.visible { opacity: 1; pointer-events: all; }
.btn-action {
font-family: inherit; font-size: 12px; font-weight: 500;
padding: 6px 14px; border-radius: 12px; border: none;
cursor: pointer; transition: opacity 0.15s, background 0.2s, color 0.2s;
}
.btn-action:active { opacity: 0.6; }

.btn-theme-toggle {
width: 28px;
height: 28px;
border-radius: 8px;
border: 2px solid rgba(128,128,128,0.25);
cursor: pointer;
flex-shrink: 0;
transition: background 0.2s, transform 0.12s;
position: relative;
overflow: hidden;
user-select: none;
-webkit-user-select: none;
-webkit-touch-callout: none;
}
.btn-theme-toggle:active { transform: scale(0.91); }
/* hold progress ring drawn via outline animation */
.btn-theme-toggle::after {
content: ‘’;
position: absolute;
inset: -3px;
border-radius: 11px;
border: 2px solid transparent;
transition: border-color 0.1s;
}
.btn-theme-toggle.holding::after {
border-color: rgba(128,128,128,0.6);
animation: hold-pulse 4s linear forwards;
}
@keyframes hold-pulse {
from { opacity: 0.3; }
to   { opacity: 1; }
}

#exportCanvas { display: none; }

/* ── COLOR PICKER BOX ── */
.cp-box {
width: min(700px, 96vw);
border-radius: 20px;
border: 1px solid rgba(128,128,128,0.18);
overflow: hidden;
transition: background 0.2s, border-color 0.2s;
display: none;
}
.cp-box.open { display: block; }

/* BG / WF / BO tabs */
.cp-tabs {
display: flex;
border-bottom: 1px solid rgba(128,128,128,0.13);
}
.cp-tab {
flex: 1; padding: 12px 6px;
font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
text-align: center; cursor: pointer;
opacity: 0.32; transition: opacity 0.15s;
border: none; background: transparent; font-family: inherit;
}
.cp-tab.active { opacity: 1; }

.cp-body { padding: 16px; display: flex; flex-direction: column; gap: 13px; }

/* HSV gradient square */
.hsv-wrap {
position: relative;
width: 100%;
padding-bottom: 46%; /* aspect ratio ~2:1 */
border-radius: 10px;
overflow: hidden;
cursor: crosshair;
flex-shrink: 0;
user-select: none;
}
#hsvCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hsv-cursor {
position: absolute;
width: 14px; height: 14px;
border-radius: 50%;
border: 2px solid #fff;
box-shadow: 0 0 0 1.5px rgba(0,0,0,0.45);
transform: translate(-50%, -50%);
pointer-events: none;
}

/* Hue slider */
.hue-slider-wrap {
position: relative;
height: 24px;
cursor: pointer;
}
.hue-slider-track {
position: absolute;
left: 0; right: 0;
top: 50%; transform: translateY(-50%);
height: 12px;
border-radius: 6px;
pointer-events: none;
background: linear-gradient(to right,
hsl(0,100%,50%), hsl(30,100%,50%), hsl(60,100%,50%), hsl(90,100%,50%),
hsl(120,100%,50%), hsl(150,100%,50%), hsl(180,100%,50%), hsl(210,100%,50%),
hsl(240,100%,50%), hsl(270,100%,50%), hsl(300,100%,50%), hsl(330,100%,50%), hsl(360,100%,50%));
}
.hue-thumb {
position: absolute;
top: 50%; transform: translate(-50%, -50%);
width: 20px; height: 20px;
border-radius: 50%;
background: #fff;
border: 2px solid rgba(0,0,0,0.2);
box-shadow: 0 1px 4px rgba(0,0,0,0.35);
pointer-events: none;
z-index: 2;
}

/* S and V sliders */
.sv-row { display: flex; gap: 10px; align-items: center; }
.sv-label { font-size: 10px; opacity: 0.45; width: 10px; flex-shrink: 0; text-align: center; }
.sv-slider-wrap {
flex: 1; height: 24px; cursor: pointer; position: relative;
}
.sv-slider-track {
position: absolute;
left: 0; right: 0;
top: 50%; transform: translateY(-50%);
height: 12px;
border-radius: 6px;
pointer-events: none;
}
.sv-thumb {
position: absolute;
top: 50%; transform: translate(-50%, -50%);
width: 20px; height: 20px;
border-radius: 50%;
background: #fff;
border: 2px solid rgba(0,0,0,0.2);
box-shadow: 0 1px 4px rgba(0,0,0,0.35);
pointer-events: none;
z-index: 2;
}
.cp-auto-row {
display: flex;
gap: 20px;
padding: 10px 16px 2px;
border-bottom: 1px solid rgba(128,128,128,0.13);
}
.cp-auto-label {
display: flex;
align-items: center;
gap: 7px;
font-size: 12px;
opacity: 0.7;
cursor: pointer;
user-select: none;
}
.cp-auto-label input[type=“checkbox”] {
width: 14px; height: 14px;
cursor: pointer;
accent-color: currentColor;
}

.input-row {
display: flex;
gap: 8px;
align-items: center;
}
.hex-wrap { display: flex; align-items: center; gap: 5px; flex: 1.5; }
.hex-label { font-size: 11px; opacity: 0.45; flex-shrink: 0; }
.hex-input {
flex: 1; font-size: 12px; font-family: monospace;
padding: 6px 8px; border-radius: 8px;
border: 1px solid rgba(128,128,128,0.22);
background: rgba(128,128,128,0.09);
color: inherit; outline: none; width: 0;
}
.rgb-wrap { display: flex; gap: 5px; flex: 2; }
.rgb-input {
flex: 1; font-size: 12px; text-align: center;
padding: 6px 3px; border-radius: 8px;
border: 1px solid rgba(128,128,128,0.22);
background: rgba(128,128,128,0.09);
color: inherit; outline: none; width: 0; min-width: 0;
}

/* preview swatch */
.preview-swatch {
width: 36px; height: 36px;
border-radius: 9px;
border: 1px solid rgba(128,128,128,0.2);
flex-shrink: 0;
transition: background 0.1s;
}
</style>

</head>

<script>
// ── iOS SILENT MODE BYPASS ──
// Creating and resuming an AudioContext on first touch forces iOS to use
// the playback audio session, which plays through silent mode.
(function() {
  let unlocked = false;
  let ctx;

  function unlock() {
    if (unlocked) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    // create and play a silent buffer
    const buf = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start(0);
    // resume in case it started suspended
    if (ctx.state === 'suspended') ctx.resume();
    unlocked = true;
    document.removeEventListener('touchstart', unlock, true);
    document.removeEventListener('touchend', unlock, true);
    document.removeEventListener('click', unlock, true);
  }

  document.addEventListener('touchstart', unlock, true);
  document.addEventListener('touchend', unlock, true);
  document.addEventListener('click', unlock, true);
})();

// ─────────────────────────────────────────────
// WAVE CANVAS — declared first so redraw() can use it
// ─────────────────────────────────────────────
const canvas    = document.getElementById('waveCanvas');
const ctx       = canvas.getContext('2d');
const exportCvs = document.getElementById('exportCanvas');
const ectx      = exportCvs.getContext('2d');

// ─────────────────────────────────────────────
// RECORDING STATE — declared early so redraw() can reference them
// ─────────────────────────────────────────────
let audioCtx2, analyser, micSource, micStream;
let mediaRecorder, audioChunks = [];
let isRecording = false, isPlaying = false;
let animFrame, playInterval;
let liveBuffer   = new Float32Array(75); // BAR_COUNT not yet defined, use literal
let finalBars    = null;
let playhead     = -1;
let recordedBlob = null, audioBuffer = null;
let _idleBars    = new Float32Array(76).fill(0).map((_,i) => 0.06 + Math.abs(Math.sin(i * 0.55)) * 0.04);

// ─────────────────────────────────────────────
// CONSTANTS
// ─────────────────────────────────────────────
const BAR_COUNT = 75;
const BAR_GAP   = 3.2;
const EXPORT_W  = 1090;
const EXPORT_H  = 180;
const EXPORT_PAD = 500;
const DELAY_MS  = 1000;

// ─────────────────────────────────────────────
// COLOR STATE
// ─────────────────────────────────────────────
// Per-channel HSV state
const channels = {
  bg: { h: 0,   s: 0,   v: 12  },   // near black
  wf: { h: 0,   s: 0,   v: 100 },   // white
  bo: { h: 0,   s: 0,   v: 22  },   // dark grey
};
let activeChannel = 'bg';

// Derived hex strings (updated by applyChannel)
let colorBg        = '#1e1e1e';
let colorBarBright = '#ffffff';
let colorPillBorder= '#383838';
let colorPillBorderWidth = 1;
let colorPillBg    = '#2a2a2a';
let colorBtnBg     = '#ffffff';
let colorBtnFg     = '#1e1e1e';
let colorIconColor = '#ffffff';
let autoBorder     = true;
let autoWave       = true;

// ─────────────────────────────────────────────
// HSV ↔ RGB ↔ HEX utilities
// ─────────────────────────────────────────────
function hsvToRgb(h, s, v) {
  s /= 100; v /= 100;
  const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
  let r=0,g=0,b=0;
  if      (h < 60)  { r=c; g=x; }
  else if (h < 120) { r=x; g=c; }
  else if (h < 180) { g=c; b=x; }
  else if (h < 240) { g=x; b=c; }
  else if (h < 300) { r=x; b=c; }
  else              { r=c; b=x; }
  return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
}

function rgbToHsv(r, g, b) {
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  let h=0, s=max===0?0:d/max, v=max;
  if (d!==0) {
    if      (max===r) h=((g-b)/d+6)%6;
    else if (max===g) h=(b-r)/d+2;
    else              h=(r-g)/d+4;
    h*=60;
  }
  return [Math.round(h), Math.round(s*100), Math.round(v*100)];
}

function rgbToHex(r,g,b) {
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

function hexToRgb(hex) {
  hex = hex.replace('#','');
  if (hex.length===3) hex=hex.split('').map(c=>c+c).join('');
  const n=parseInt(hex,16)||0;
  return [(n>>16)&255,(n>>8)&255,n&255];
}

// luminance 0-1
function luminance(r,g,b) {
  return (0.299*r + 0.587*g + 0.114*b) / 255;
}

// ─────────────────────────────────────────────
// APPLY COLOR TO UI
// ─────────────────────────────────────────────
const card   = document.getElementById('card');
const pill   = document.getElementById('pill');
const btnMain= document.getElementById('btnMain');
const cpBox  = document.getElementById('cpBox');

function applyBg(hex) {
  colorBg = hex;
  card.style.background = hex;
  cpBox.style.background = hex;

  const [r,g,b] = hexToRgb(hex);
  const lum = luminance(r,g,b);
  const textColor = lum > 0.5 ? '#111111' : '#ffffff';
  card.style.color = textColor;
  cpBox.style.color = textColor;

  // auto-derive wf and bo using desaturate + value shift
  const derivedHex = autoDerive(hex);
  const [dr,dg,db] = hexToRgb(derivedHex);
  const [dh,ds,dv] = rgbToHsv(dr,dg,db);

  if (autoWave) {
    colorBarBright = derivedHex;
    channels.wf = { h:dh, s:ds, v:dv };
  }
  if (autoBorder) {
    colorPillBorder = derivedHex;
    colorIconColor  = derivedHex;
    channels.bo = { h:dh, s:ds, v:dv };
    pill.style.borderColor = derivedHex;
  }

  // pill bg: subtle tint
  const [r2,g2,b2] = hexToRgb(hex);
  const lum2 = luminance(r2,g2,b2);
  colorPillBg = lum2 > 0.5 ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.07)';

  applyPill();
  applyBtn();
  redraw();
}

function applyWf(hex) {
  if (autoWave) return; // controlled by autoDerive
  colorBarBright = hex;
  redraw();
}

function applyBo(hex) {
  if (autoBorder) return; // controlled by autoDerive
  colorPillBorder = hex;
  pill.style.borderColor = hex;
  cpBox.style.borderColor = hex;
}

function applyBorderWidth(w) {
  colorPillBorderWidth = w;
  pill.style.borderWidth = w + 'px';
}

function applyPill() {
  pill.style.background   = colorPillBg;
  pill.style.borderColor  = colorPillBorder;
  pill.style.borderWidth  = colorPillBorderWidth + 'px';
}

function applyBtn() {
  btnMain.style.background = 'transparent';
  const iconColor = colorIconColor;
  btnMain.style.color = iconColor;
  btnMain.querySelectorAll('svg').forEach(s => {
    s.style.color = iconColor;
    // update all child elements that have fill or stroke set (not 'none')
    s.querySelectorAll('[fill]:not([fill="none"])').forEach(el => el.setAttribute('fill', iconColor));
    s.querySelectorAll('[stroke]:not([stroke="none"])').forEach(el => el.setAttribute('stroke', iconColor));
  });

  const textColor = card.style.color || colorBarBright;

  const btnClear = document.getElementById('btnClear');
  btnClear.style.background = colorPillBg;
  btnClear.style.color = textColor;
  btnClear.style.border = `1px solid ${colorPillBorder}`;

  const btnExp = document.getElementById('btnExport');
  btnExp.style.background = colorPillBorder;
  btnExp.style.color = colorBg;
  btnExp.style.border = 'none';

  document.getElementById('btnDev').style.color = textColor;
}

// Theme applied via applyThemePreset(0) below

// ─────────────────────────────────────────────
// COLOR PICKER UI
// ─────────────────────────────────────────────
const hsvCanvas  = document.getElementById('hsvCanvas');
const hsvCtx     = hsvCanvas.getContext('2d');
const hsvWrap    = document.getElementById('hsvWrap');
const hsvCursor  = document.getElementById('hsvCursor');
const hueSlider  = document.getElementById('hueSlider');
const hueThumb   = document.getElementById('hueThumb');
const hexInput   = document.getElementById('hexInput');
const rInput     = document.getElementById('rInput');
const gInput     = document.getElementById('gInput');
const bInput     = document.getElementById('bInput');
const preview    = document.getElementById('previewSwatch');

function drawHsvSquare(h) {
  const W = hsvCanvas.width, H = hsvCanvas.height;
  // saturation: left=0 right=100, value: top=100 bottom=0
  const imgData = hsvCtx.createImageData(W, H);
  for (let y=0; y<H; y++) {
    for (let x=0; x<W; x++) {
      const s = (x / W) * 100;
      const v = (1 - y / H) * 100;
      const [r,g,b] = hsvToRgb(h, s, v);
      const idx = (y*W+x)*4;
      imgData.data[idx]=r; imgData.data[idx+1]=g; imgData.data[idx+2]=b; imgData.data[idx+3]=255;
    }
  }
  hsvCtx.putImageData(imgData, 0, 0);
}

function sizeHsvCanvas() {
  const rect = hsvWrap.getBoundingClientRect();
  hsvCanvas.width  = Math.max(Math.round(rect.width), 2);
  hsvCanvas.height = Math.max(Math.round(rect.height), 2);
  drawHsvSquare(channels[activeChannel].h);
}

function updateAllUI() {
  const ch = channels[activeChannel];
  const [r,g,b] = hsvToRgb(ch.h, ch.s, ch.v);
  const hex = rgbToHex(r,g,b);

  // preview
  preview.style.background = hex;

  // hex input
  hexInput.value = hex;

  // rgb inputs
  rInput.value = r; gInput.value = g; bInput.value = b;

  // hue thumb
  hueThumb.style.left = (ch.h / 360 * 100) + '%';

  // hsv cursor
  hsvCursor.style.left  = ch.s + '%';
  hsvCursor.style.top   = (100 - ch.v) + '%';

  // redraw hsv square if hue changed
  drawHsvSquare(ch.h);

  // apply to recording UI
  if (activeChannel === 'bg') applyBg(hex);
  else if (activeChannel === 'wf') applyWf(hex);
  else applyBo(hex);
}

// ── AUTO BORDER / WAVEFORM ──

function autoDerive(bgHex) {
  const [r,g,b] = hexToRgb(bgHex);
  const [h,s,v] = rgbToHsv(r,g,b);
  // darken features if bg is light (low sat grey) OR very bright (any color near full brightness)
  const isLight = (v >= 75 && s <= 12) || v >= 88;
  if (isLight) {
    return rgbToHex(...hsvToRgb(h, s * 0.5, Math.max(v - 60, 8)));
  } else {
    return rgbToHex(...hsvToRgb(h, s * 0.55, Math.min(v + 45, 96)));
  }
}

function rebuildTabs() {
  const tabBar = document.getElementById('cpTabs');
  tabBar.innerHTML = '';
  const tabs = [{ target: 'bg', label: 'Main' }];
  if (!autoWave)   tabs.push({ target: 'wf', label: 'Waveform' });
  if (!autoBorder) tabs.push({ target: 'bo', label: 'Border' });

  tabs.forEach(({ target, label }) => {
    const btn = document.createElement('button');
    btn.className = 'cp-tab' + (activeChannel === target ? ' active' : '');
    btn.dataset.target = target;
    btn.textContent = label;
    btn.addEventListener('click', () => {
      activeChannel = target;
      thicknessRow.style.display = activeChannel === 'bo' ? 'flex' : 'none';
      tabBar.querySelectorAll('.cp-tab').forEach(t => t.classList.toggle('active', t.dataset.target === activeChannel));
      updateAllUI();
    });
    tabBar.appendChild(btn);
  });

  // if active tab no longer exists, fall back to bg
  if (!tabs.find(t => t.target === activeChannel)) {
    activeChannel = 'bg';
    thicknessRow.style.display = 'none';
  }
}

document.getElementById('chkAutoBorder').addEventListener('change', e => {
  autoBorder = e.target.checked;

    const [r,g,b] = hexToRgb(derived);
    channels.bo = { ...rgbToHsv(r,g,b).reduce((o,v,i)=>({...o,[['h','s','v'][i]]:v}),{}) };
    applyBo(derived);
    applyBtn();

});

document.getElementById('chkAutoWave').addEventListener('change', e => {

// drag helpers
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function dragOn(el, onMove) {
  let active = false;
  function start(e) { active=true; onMove(e); e.preventDefault(); }
  function move(e)  { if(active) onMove(e); }
  function end()    { active=false; }
  el.addEventListener('pointerdown', start);
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
}

function sizeCanvas() {
  const dpr  = devicePixelRatio || 1;
  const pillW = pill.clientWidth;
  const pillH = pill.clientHeight;
  const cssW = pillW - 38 - 14 - 28;
  const cssH = pillH;
  canvas.width  = Math.max(cssW * dpr, 80);
  canvas.height = Math.max(cssH * dpr, 40);
  canvas.style.width  = Math.max(cssW, 80) + 'px';
  canvas.style.height = Math.max(cssH, 40) + 'px';
}
sizeCanvas();
window.addEventListener('resize', () => {
  if (document.getElementById('cpBox').classList.contains('open')) {
    sizeHsvCanvas(); updateAllUI();
  }
  sizeCanvas(); redraw();
});

exportCvs.width  = EXPORT_W;
exportCvs.height = EXPORT_H;

function drawBars(bars, litUpTo, tctx, w, h) {
  const barW = (w - (BAR_COUNT - 1) * BAR_GAP) / BAR_COUNT;
  const maxH = h * 0.9;
  const cy   = h / 2;
  const [r,g,b] = hexToRgb(colorBarBright);
  const [br,bg2,bb] = hexToRgb(colorBg);

  // resolve pill bg to solid
  const pillMatch = colorPillBg.match(/[\d.]+/g);
  let pr, pg, pb;
  if (pillMatch && pillMatch.length >= 4) {
    const a = parseFloat(pillMatch[3]);
    pr = Math.round(parseInt(pillMatch[0]) * a + br * (1-a));
    pg = Math.round(parseInt(pillMatch[1]) * a + bg2 * (1-a));
    pb = Math.round(parseInt(pillMatch[2]) * a + bb * (1-a));
  } else {
    [pr, pg, pb] = hexToRgb(colorPillBg);
  }

  // fill canvas with solid pill background
  tctx.fillStyle = `rgb(${pr},${pg},${pb})`;
  tctx.fillRect(0, 0, w, h);

  // dim color: colorBarBright at reduced opacity blended into pill bg
  const dimR = Math.round(r * 0.35 + pr * 0.65);
  const dimG = Math.round(g * 0.35 + pg * 0.65);
  const dimB = Math.round(b * 0.35 + pb * 0.65);

  for (let i = 0; i < BAR_COUNT; i++) {
    const x   = i * (barW + BAR_GAP);
    const amp = Math.max(bars[i] || 0, 0);
    const bh  = Math.max(amp * maxH, barW);
    const lit = litUpTo !== null && litUpTo >= 0 && i <= litUpTo;
    tctx.fillStyle = lit ? `rgb(${r},${g},${b})` : `rgb(${dimR},${dimG},${dimB})`;
    const rx = barW / 2;
    const y0 = cy - bh / 2;
    tctx.beginPath();
    tctx.moveTo(x + rx, y0);
    tctx.lineTo(x + barW - rx, y0);
    tctx.quadraticCurveTo(x + barW, y0, x + barW, y0 + rx);
    tctx.lineTo(x + barW, y0 + bh - rx);
    tctx.quadraticCurveTo(x + barW, y0 + bh, x + barW - rx, y0 + bh);
    tctx.lineTo(x + rx, y0 + bh);
    tctx.quadraticCurveTo(x, y0 + bh, x, y0 + bh - rx);
    tctx.lineTo(x, y0 + rx);
    tctx.quadraticCurveTo(x, y0, x + rx, y0);
    tctx.closePath();
    tctx.fill();
  }
}

function redraw() {
  const w = canvas.width, h = canvas.height;
  if (finalBars) drawBars(finalBars, playhead, ctx, w, h);
  else drawBars(_idleBars, null, ctx, w, h);
}

// RECORDING STATE

// ─────────────────────────────────────────────
// RECORDING
// ─────────────────────────────────────────────

const btnExport = document.getElementById('btnExport');
const btnClear  = document.getElementById('btnClear');
const actions   = document.getElementById('actions');
const statusEl  = document.getElementById('status');

// hide the pill status text whenever we're not in idle state
function setStatus(text) {
  statusEl.textContent = text;
  const isIdle = (text === 'Tap to record');
  statusEl.classList.toggle('hidden', !isIdle);
}

async function startRecording() {
  audioCtx2 = new (window.AudioContext || window.webkitAudioContext)();
  micStream  = await navigator.mediaDevices.getUserMedia({ audio: true });
  analyser   = audioCtx2.createAnalyser();
  analyser.fftSize = 512;
  micSource  = audioCtx2.createMediaStreamSource(micStream);
  micSource.connect(analyser);

  const recMime = ['audio/webm;codecs=opus','audio/webm','audio/ogg','audio/mp4']
    .find(m => MediaRecorder.isTypeSupported(m)) || '';
  mediaRecorder = new MediaRecorder(micStream, recMime ? { mimeType: recMime } : {});
  audioChunks   = [];
  mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
  mediaRecorder.start(100);

  isRecording = true;
  window._rawSamples = [];
  liveBuffer = new Float32Array(BAR_COUNT);
  let liveMax = 0.001; // very low so first sound immediately fills height
  btnMain.className = 'btn-circle recording';
  setStatus('Recording…');

  const dataArr = new Uint8Array(analyser.frequencyBinCount);
  const FRAMES_PER_BAR = 4;
  let frameAcc = 0, rmsAcc = 0;

  function tick() {
    if (!isRecording) return;
    analyser.getByteTimeDomainData(dataArr);
    let sum = 0;
    for (let i = 0; i < dataArr.length; i++) { const v=(dataArr[i]-128)/128; sum+=v*v; }
    const rms = Math.sqrt(sum/dataArr.length);
    window._rawSamples.push(rms);
    rmsAcc += rms; frameAcc++;

    if (frameAcc >= FRAMES_PER_BAR) {
      const avg = rmsAcc / frameAcc;
      // update rolling max — only goes up, never down
      if (avg > liveMax) liveMax = avg;

      for (let i = 0; i < BAR_COUNT-1; i++) liveBuffer[i] = liveBuffer[i+1];
      liveBuffer[BAR_COUNT-1] = avg / liveMax; // normalize only the new bar
      frameAcc = 0; rmsAcc = 0;
    }

    drawBars(liveBuffer, BAR_COUNT - 1, ctx, canvas.width, canvas.height);
    animFrame = requestAnimationFrame(tick);
  }
  animFrame = requestAnimationFrame(tick);
}

async function stopRecording() {
  isRecording = false;
  cancelAnimationFrame(animFrame);
  setStatus('Processing…');
  btnMain.className = 'btn-circle';
  micSource.disconnect();
  micStream.getTracks().forEach(t => t.stop());

  mediaRecorder.onstop = async () => {
    const blobType = mediaRecorder.mimeType || 'audio/webm';
    recordedBlob = new Blob(audioChunks, { type: blobType });
    const buf    = await recordedBlob.arrayBuffer();
    const tmpCtx = new AudioContext();
    try {
      audioBuffer = await tmpCtx.decodeAudioData(buf);
    } catch(e) {
      setStatus('Error processing audio');
      return;
    }

    const ch   = audioBuffer.getChannelData(0);
    const step = Math.floor(ch.length / BAR_COUNT);
    finalBars  = new Float32Array(BAR_COUNT);
    let maxAmp = 0;
    for (let i = 0; i < BAR_COUNT; i++) {
      let s=0;
      for (let j=0;j<step;j++){const v=ch[i*step+j]||0;s+=v*v;}
      finalBars[i]=Math.sqrt(s/step);
      if(finalBars[i]>maxAmp)maxAmp=finalBars[i];
    }
    if(maxAmp>0)for(let i=0;i<BAR_COUNT;i++)finalBars[i]/=maxAmp;

    playhead=-1;
    btnMain.className='btn-circle ready';
    drawBars(finalBars,playhead,ctx,canvas.width,canvas.height);
    actions.classList.add('visible');
    setStatus('Tap to play');
  };

  mediaRecorder.stop();
}

function stopPlayback() {
  isPlaying=false;
  if(playInterval)clearInterval(playInterval);
  try{window._playingSrc.stop();}catch(e){}
  btnMain.className='btn-circle ready';
  setStatus('Tap to play');
}

function startPlayback() {
  if(!finalBars)return;
  isPlaying=true;
  btnMain.className='btn-circle playing';
  setStatus('Playing…');
  playhead=0;
  const tmpCtx=new AudioContext();
  const src=tmpCtx.createBufferSource();
  src.buffer=audioBuffer;
  src.connect(tmpCtx.destination);
  src.start();
  window._playingSrc=src;
  const durMs=audioBuffer.duration*1000;
  const stepMs=durMs/BAR_COUNT;
  const t0=performance.now();
  playInterval=setInterval(()=>{
    playhead=Math.floor((performance.now()-t0)/stepMs);
    if(playhead>=BAR_COUNT){stopPlayback();playhead=BAR_COUNT-1;drawBars(finalBars,playhead,ctx,canvas.width,canvas.height);return;}
    drawBars(finalBars,playhead,ctx,canvas.width,canvas.height);
  },16);
  src.onended=()=>{if(isPlaying)stopPlayback();};
}

btnMain.addEventListener('click',async()=>{
  if(isRecording && fakeTicker){ stopFakeRecording(); return; }
  if(isRecording){stopRecording();return;}
  if(isPlaying){stopPlayback();return;}
  if(finalBars){startPlayback();return;}
  try{await startRecording();}
  catch(e){setStatus('Mic access denied');}
});

// ─────────────────────────────────────────────
// EXPORT
// ─────────────────────────────────────────────
let exportedBlob = null;
let exportedFilename = null;

btnExport.addEventListener('click', async () => {
  // if we already have a rendered blob, share it directly (preserves gesture)
  if (exportedBlob) {
    await doShare(exportedBlob, exportedFilename);
    return;
  }

  if(!finalBars||!recordedBlob)return;
  if(isPlaying)stopPlayback();
  btnExport.textContent='Rendering…';
  btnExport.disabled=true;
  setStatus('Rendering…');

  const actx=new AudioContext();
  const abuf=await recordedBlob.arrayBuffer();
  let decoded;
  try{decoded=await actx.decodeAudioData(abuf);}
  catch(e){setStatus('Export failed');btnExport.textContent='Save video';btnExport.disabled=false;return;}

  const audioDurMs=Math.max(decoded.duration*1000,500);
  const totalDurMs=DELAY_MS+audioDurMs+300;
  const stepMs=audioDurMs/BAR_COUNT;

  exportCvs.width=EXPORT_W+EXPORT_PAD*2; exportCvs.height=EXPORT_H+EXPORT_PAD*2;

  function drawExportFrame(ph,showPause){
    const W=EXPORT_W,H=EXPORT_H;
    const CW=W+EXPORT_PAD*2,CH=H+EXPORT_PAD*2;
    const OX=EXPORT_PAD,OY=EXPORT_PAD;
    const BTN_R=42;
    const BTN_CX=OX+36+BTN_R,BTN_CY=OY+H/2;
    const WAVE_X=BTN_CX+BTN_R+24,WAVE_W=OX+W-WAVE_X-36;

    // clear to transparent
    ectx.clearRect(0,0,CW,CH);

    // plain rectangle fill
    const [ebr,ebg,ebb]=hexToRgb(colorBg);
    const pillM=colorPillBg.match(/[\d.]+/g);
    let epr,epg,epb;
    if(pillM&&pillM.length>=4){const a=parseFloat(pillM[3]);epr=Math.round(parseInt(pillM[0])*a+ebr*(1-a));epg=Math.round(parseInt(pillM[1])*a+ebg*(1-a));epb=Math.round(parseInt(pillM[2])*a+ebb*(1-a));}
    else{[epr,epg,epb]=hexToRgb(colorPillBg);}
    ectx.fillStyle=`rgb(${epr},${epg},${epb})`;
    ectx.fillRect(OX,OY,W,H);

    // icon
    ectx.fillStyle=colorIconColor;
    if(showPause){
      const bw=7,bh2=26,gap=10,bx=BTN_CX-gap/2-bw,by=BTN_CY-bh2/2;
      ectx.beginPath();ectx.roundRect(bx,by,bw,bh2,2);ectx.fill();
      ectx.beginPath();ectx.roundRect(bx+bw+gap,by,bw,bh2,2);ectx.fill();
    } else {
      const sz=24;
      ectx.beginPath();ectx.moveTo(BTN_CX-sz*.45,BTN_CY-sz*.5);ectx.lineTo(BTN_CX+sz*.55,BTN_CY);ectx.lineTo(BTN_CX-sz*.45,BTN_CY+sz*.5);ectx.closePath();ectx.fill();
    }

    // bars
    const barW=(WAVE_W-(BAR_COUNT-1)*BAR_GAP)/BAR_COUNT;
    const maxBarH=H*.88,cy=OY+H/2;
    const [r,g,b]=hexToRgb(colorBarBright);
    const [br2,bg3,bb2]=hexToRgb(colorBg);
    const [pr2,pg2,pb2]=[Math.round(br2*0.93),Math.round(bg3*0.93),Math.round(bb2*0.93)];
    const dimR2=Math.round(r*0.35+pr2*0.65),dimG2=Math.round(g*0.35+pg2*0.65),dimB2=Math.round(b*0.35+pb2*0.65);
    for(let i=0;i<BAR_COUNT;i++){
      const bx=WAVE_X+i*(barW+BAR_GAP),amp=Math.max(finalBars[i]||0,0),bh=Math.max(amp*maxBarH,barW);
      const lit=ph>=0&&i<=ph;
      ectx.fillStyle=lit?`rgb(${r},${g},${b})`:`rgb(${dimR2},${dimG2},${dimB2})`;
      const rx=barW/2,y0=cy-bh/2;
      ectx.beginPath();ectx.moveTo(bx+rx,y0);ectx.lineTo(bx+barW-rx,y0);ectx.quadraticCurveTo(bx+barW,y0,bx+barW,y0+rx);
      ectx.lineTo(bx+barW,y0+bh-rx);ectx.quadraticCurveTo(bx+barW,y0+bh,bx+barW-rx,y0+bh);
      ectx.lineTo(bx+rx,y0+bh);ectx.quadraticCurveTo(bx,y0+bh,bx,y0+bh-rx);
      ectx.lineTo(bx,y0+rx);ectx.quadraticCurveTo(bx,y0,bx+rx,y0);ectx.closePath();ectx.fill();
    }
  }

  const dest=actx.createMediaStreamDestination();
  const expSrc=actx.createBufferSource();
  expSrc.buffer=decoded;

  // use a compressor to tame peaks without distortion
  const compressor=actx.createDynamicsCompressor();
  compressor.threshold.value=-6;
  compressor.knee.value=6;
  compressor.ratio.value=3;
  compressor.attack.value=0.003;
  compressor.release.value=0.1;
  expSrc.connect(compressor);
  compressor.connect(dest);
  const canvasStream=exportCvs.captureStream(30);
  canvasStream.addTrack(dest.stream.getAudioTracks()[0]);
  const mimeType = [
    'video/mp4',
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm'
  ].find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';
  const ext = mimeType.startsWith('video/mp4') ? 'mp4' : 'webm';
  const recorder=new MediaRecorder(canvasStream, mimeType ? {mimeType} : {});
  const chunks=[];
  recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
  recorder.onstop=async()=>{
    const blob=new Blob(chunks,{type:mimeType});
    const filename=`waveform.${ext}`;
    exportedBlob=blob;
    exportedFilename=filename;
    btnExport.textContent='Tap to share';
    btnExport.disabled=false;
    setStatus('Ready to share');
  };
  drawExportFrame(-1,false);
  recorder.start(100);
  setTimeout(()=>expSrc.start(),DELAY_MS);
  const t0=performance.now();

  // safety: force stop after totalDurMs + 3s in case interval misfires
  const safetyTimeout = setTimeout(()=>{
    clearInterval(expInt);
    if(recorder.state==='recording') recorder.stop();
  }, totalDurMs + 3000);

  const expInt=setInterval(()=>{
    const elapsed=performance.now()-t0,ae=elapsed-DELAY_MS,playing=ae>=0;
    const ph=playing?Math.min(Math.floor(ae/stepMs),BAR_COUNT-1):-1;
    drawExportFrame(ph,playing);
    if(elapsed>=totalDurMs){
      clearInterval(expInt);
      clearTimeout(safetyTimeout);
      drawExportFrame(BAR_COUNT-1,true);
      recorder.stop();
    }
  },33);
});

async function doShare(blob, filename) {
  const file = new File([blob], filename, { type: blob.type });
  if (navigator.share) {
    try {
      await navigator.share({ files: [file], title: 'Waveform' });
      return;
    } catch(e) {
      if (e.name === 'AbortError') return; // user cancelled, do nothing
    }
  }
  // fallback: download
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ─────────────────────────────────────────────
// CLEAR
// ─────────────────────────────────────────────
btnClear.addEventListener('click',()=>{
  if(isRecording||isPlaying)return;
  finalBars=null;recordedBlob=null;audioBuffer=null;playhead=-1;
  exportedBlob=null;exportedFilename=null;
  btnMain.className='btn-circle';
  btnExport.textContent='Save video';
  actions.classList.remove('visible');
  setStatus('Tap to record');
  redraw();
});

// ─────────────────────────────────────────────
// DEV: FAKE RECORDING
// ─────────────────────────────────────────────
let fakeTicker = null;
let fakeRawSamples = [];

async function stopFakeRecording() {
  if (fakeTicker) { clearInterval(fakeTicker); fakeTicker = null; }
  isRecording = false;
  btnMain.className = 'btn-circle';
  setStatus('Processing…');

  // build final bars from collected raw samples
  const raw = fakeRawSamples;
  if (raw.length === 0) { setStatus('Tap to record'); return; }

  finalBars = new Float32Array(BAR_COUNT);
  const step = raw.length / BAR_COUNT;
  let maxAmp = 0;
  for (let b = 0; b < BAR_COUNT; b++) {
    const s = Math.floor(b * step), e = Math.min(Math.ceil((b+1)*step), raw.length);
    let acc = 0; for (let j = s; j < e; j++) acc += raw[j];
    finalBars[b] = e > s ? acc/(e-s) : 0;
    if (finalBars[b] > maxAmp) maxAmp = finalBars[b];
  }
  if (maxAmp > 0) for (let b = 0; b < BAR_COUNT; b++) finalBars[b] /= maxAmp;

  playhead = -1;
  drawBars(finalBars, playhead, ctx, canvas.width, canvas.height);

  // build a silent audio blob of matching duration
  const dur = Math.max(fakeRawSamples.length / 60, 0.5); // ~60 samples/sec
  const sr = 44100;
  const offCtx = new OfflineAudioContext(1, Math.floor(sr*dur), sr);
  const sb = offCtx.createBuffer(1, Math.floor(sr*dur), sr);
  const ch2 = sb.getChannelData(0);
  for (let s2 = 0; s2 < ch2.length; s2++) ch2[s2] = (Math.random()-.5)*.01;
  const ss = offCtx.createBufferSource(); ss.buffer = sb; ss.connect(offCtx.destination); ss.start();
  const rendered = await offCtx.startRendering();
  recordedBlob = new Blob([audioBufferToWav(rendered)], { type: 'audio/wav' });
  const tmpCtx = new AudioContext();
  audioBuffer = await tmpCtx.decodeAudioData(await recordedBlob.arrayBuffer()).catch(() => rendered);

  btnMain.className = 'btn-circle ready';
  setStatus('Tap to play');
  actions.classList.add('visible');
}

document.getElementById('btnDev').addEventListener('click', () => {
  if (isPlaying) return;

  // if already fake-recording, stop it
  if (isRecording && fakeTicker) {
    stopFakeRecording();
    return;
  }

  finalBars = null; recordedBlob = null; audioBuffer = null; playhead = -1;
  fakeRawSamples = [];
  actions.classList.remove('visible');

  isRecording = true;
  btnMain.className = 'btn-circle recording';
  setStatus('Recording…');

  const scrollBuf = new Float32Array(BAR_COUNT);
  let val = 0.3;

  fakeTicker = setInterval(() => {
    // generate next sample with smooth random walk
    val += (Math.random() - 0.45) * 0.12;
    val = Math.max(0.04, Math.min(1, val));
    fakeRawSamples.push(val);

    // scroll left, push new on right
    for (let b = 0; b < BAR_COUNT - 1; b++) scrollBuf[b] = scrollBuf[b+1];
    scrollBuf[BAR_COUNT-1] = val;
    drawBars(scrollBuf, BAR_COUNT - 1, ctx, canvas.width, canvas.height);
  }, 50); // ~20 samples/sec, smooth scroll
});

function audioBufferToWav(buffer){
  const samples=buffer.getChannelData(0),len=samples.length,ab=new ArrayBuffer(44+len*2),view=new DataView(ab),sr=buffer.sampleRate;
  function ws(o,s){for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i));}
  ws(0,'RIFF');view.setUint32(4,36+len*2,true);ws(8,'WAVE');ws(12,'fmt ');
  view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);
  view.setUint32(24,sr,true);view.setUint32(28,sr*2,true);view.setUint16(32,2,true);
  view.setUint16(34,16,true);ws(36,'data');view.setUint32(40,len*2,true);
  let o=44;for(let i=0;i<len;i++){const s=Math.max(-1,Math.min(1,samples[i]));view.setInt16(o,s<0?s*0x8000:s*0x7FFF,true);o+=2;}
  return ab;
}
